services:
  mysql:
    image: mysql:8.4
    container_name: recall-studio-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: recall
      MYSQL_DATABASE: recall_studio
      MYSQL_USER: recall
      MYSQL_PASSWORD: recall
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - recall-mysql-data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-precall"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  recall-mysql-data:
